<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#0a0b0c; --panel:#131517; --panel-2:#1a1d20; --panel-3:#22262a;
    --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.11);
    --ink:#eef0f1; --muted:#8a9098; --faint:#565c63;
    --accent:#3ecf8e; --accent-ink:#57d69c; --accent-soft:rgba(62,207,142,.12);
    --star:#e0b24a; --danger:#e8756b;
    --mono:'DM Mono',ui-monospace,Menlo,monospace;
    --display:'Space Grotesk','DM Sans',-apple-system,sans-serif;
    --r:16px;
  }
  html[data-theme="light"]{
    color-scheme:light;
    --bg:#fbfbfa; --panel:#ffffff; --panel-2:#f5f6f5; --panel-3:#ecedec;
    --line:rgba(20,22,24,.08); --line-2:rgba(20,22,24,.14);
    --ink:#1b1e20; --muted:#6b7178; --faint:#a2a8ad;
    --accent:#12a568; --accent-ink:#0f9560; --accent-soft:rgba(18,165,104,.1);
    --star:#c08a1e; --danger:#d0574c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:'DM Sans',-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6; letter-spacing:normal;
    display:flex; flex-direction:column; height:100vh; overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
  input,textarea,select{font-family:inherit; font-size:inherit; color:inherit}
  a{color:var(--accent-ink)}
  .mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
  .lbl{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}

  header{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--line); flex:0 0 auto; background:var(--bg); z-index:5}
  .h-left{display:flex; align-items:center; gap:12px; justify-self:start}
  .h-right{display:flex; align-items:center; gap:9px; justify-self:end}
  .brand{justify-self:center; font-family:var(--display); font-weight:680; font-size:19px; letter-spacing:.5px; white-space:nowrap; display:flex; align-items:center; gap:10px; color:var(--ink)}
  .brand .logo{width:11px;height:11px;border-radius:4px;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .today{color:var(--faint); font-size:11.5px; white-space:nowrap; font-family:var(--mono); letter-spacing:.03em}
  .capture{max-width:1080px; margin:0 auto 22px; display:flex; align-items:center; gap:12px; padding:14px 18px; border:1px solid var(--line); border-radius:14px; background:var(--panel); transition:.16s}
  .capture:focus-within{border-color:var(--accent); background:var(--panel-2)}
  .cap-ic{width:22px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:17px;line-height:1;flex:0 0 auto}
  .capture input{flex:1; border:none; background:none; font-size:15.5px; color:var(--ink); padding:2px 0}
  .capture input::placeholder{color:var(--faint)}
  .capture input:focus{outline:none}
  .drag{display:inline-grid; place-items:center; width:13px; color:var(--faint); opacity:0; cursor:grab; flex:0 0 auto; transition:opacity .13s}
  .drag:active{cursor:grabbing}
  .todo:hover .drag,.card:hover .drag{opacity:.4}
  .drag:hover{opacity:1!important}
  .flat .drag{display:none}
  .dragging{opacity:.35!important}
  .search{position:relative}
  .search input{padding:9px 12px 9px 32px; border:1px solid var(--line); border-radius:11px; background:var(--panel); width:150px; transition:.16s}
  .search input::placeholder{color:var(--faint)}
  .search input:focus{outline:none; border-color:var(--line-2); width:210px; background:var(--panel-2)}
  .search svg{position:absolute; left:11px; top:10px; opacity:.4}
  .hbtn{width:36px;height:36px; display:grid; place-items:center; border:1px solid var(--line); background:var(--panel); border-radius:10px; font-size:13px; color:var(--muted)}
  .hbtn:hover{background:var(--panel-2); color:var(--ink); border-color:var(--line-2)}
  .hbtns{display:flex; gap:7px}

  .body{display:flex; flex:1; min-height:0}
  aside{width:224px; flex:0 0 auto; border-right:1px solid var(--line); padding:18px 14px; overflow-y:auto; background:var(--bg)}
  .nav-item{display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:10px; color:var(--muted); font-size:14px; user-select:none; margin-bottom:2px; transition:.13s}
  .nav-item:hover{background:var(--panel-2); color:var(--ink)}
  .nav-item.active{background:var(--panel-2); color:var(--ink); font-weight:550}
  .nav-item .ico{width:17px;height:17px; display:grid; place-items:center; opacity:.7}
  .nav-item.active .ico{color:var(--accent); opacity:1}
  .nav-item .count{margin-left:auto; font-size:11px; color:var(--faint); font-family:var(--mono)}
  .nav-sep{height:1px; background:var(--line); margin:14px 8px}
  .storage-pill{font-size:11.5px; color:var(--muted); padding:8px 12px; line-height:1.5; cursor:pointer; border-radius:8px} .storage-pill:hover{background:var(--panel-2); color:var(--ink)}
  .storage-pill b{color:var(--accent-ink); font-weight:500}
  .credit{display:block; padding:12px; font-size:11px; color:var(--faint); text-decoration:none; letter-spacing:.02em} .credit:hover{color:var(--accent-ink)}

  main{flex:1; min-width:0; overflow-y:auto; padding:30px 40px 100px}
  .wrap{max-width:1080px; margin:0 auto}
  .view-head{display:flex; align-items:flex-end; gap:14px; margin-bottom:24px}
  .view-title{font-family:var(--display); font-size:23px; font-weight:650; letter-spacing:.2px}
  .view-sub{color:var(--muted); font-size:13px; margin-top:5px; max-width:680px}
  .view-tools{margin-left:auto; display:flex; align-items:center; gap:9px}
  .sortsel{border:1px solid var(--line); background:var(--panel); border-radius:9px; padding:7px 10px; font-size:12.5px; color:var(--muted)}
  .sortsel:hover{border-color:var(--line-2)}
  .btn-primary{border:1px solid var(--line-2); background:var(--panel-2); color:var(--ink); border-radius:9px; padding:8px 15px; font-weight:550; font-size:12.5px}
  .btn-primary:hover{background:var(--panel-3); border-color:var(--line-2)}

  /* dashboard */
  .dash-hero{margin-bottom:28px}
  .dash-hero h1{margin:0; font-family:var(--display); font-size:26px; font-weight:700; letter-spacing:.2px}
  .dash-hero .sub{color:var(--muted); font-size:13px; margin-top:6px}
  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:20px 20px 18px; transition:.16s}
  .kpi.click{cursor:pointer}
  .kpi.click:hover{border-color:var(--line-2); background:var(--panel-2)}
  .kpi .k-top{display:flex; align-items:center; color:var(--muted)}
  .kpi .k-num{font-size:34px; font-weight:600; line-height:1; margin-top:18px; letter-spacing:-.5px; font-family:var(--display)}
  .kpi .k-num.accent{color:var(--accent)} .kpi .k-num.star{color:var(--star)}
  .kpi .k-num .u{font-size:12.5px; font-weight:500; color:var(--faint); margin-left:6px; letter-spacing:0; font-family:-apple-system,system-ui,sans-serif}
  .kpi .k-sub{font-size:11.5px; color:var(--faint); margin-top:14px}
  .kpi .k-sub b{color:var(--danger); font-weight:500}

  .sec-title{font-size:13px; font-weight:600; color:var(--muted); margin:34px 2px 14px; display:flex; align-items:center; gap:9px}
  .sec-title .s-count{color:var(--faint); font-weight:400; font-family:var(--mono); font-size:11.5px}
  .proj-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px}
  .pcard{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:20px; cursor:pointer; transition:.16s}
  .pcard:hover{border-color:var(--line-2); background:var(--panel-2)}
  .pcard.c-done{opacity:.5}
  .pc-x{position:absolute; top:12px; right:12px; color:var(--faint); font-size:13px; padding:2px 6px; border-radius:6px; opacity:0; transition:.13s}
  .pcard:hover .pc-x{opacity:1}
  .pc-x:hover{background:rgba(232,117,107,.13); color:var(--danger)}
  .pc-head{display:flex; align-items:center; gap:10px; margin-bottom:18px}
  .pc-dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:0 0 auto}
  .pc-dot.g{background:var(--accent)}
  .pc-title{font-weight:550; font-size:15px; line-height:1.3}
  .pc-star{margin-left:auto; color:var(--star); font-size:12px}
  .pc-pct{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:11px}
  .pc-pct .big{font-size:26px; font-weight:600; letter-spacing:-.5px; font-family:var(--display)}
  .pc-pct .frac{color:var(--muted); font-size:12px; font-family:var(--mono)}
  .pc-bar{height:5px; background:var(--panel-3); border-radius:20px; overflow:hidden}
  .pc-bar > i{display:block;height:100%;border-radius:20px; background:var(--accent); transition:width .4s cubic-bezier(.2,.7,.3,1)}
  .pc-stats{display:flex; gap:24px; margin-top:17px; padding-top:15px; border-top:1px solid var(--line)}
  .pc-stat .n{font-size:15px; font-weight:600; font-family:var(--mono)}
  .pc-stat .l{font-size:10px; color:var(--muted); margin-top:4px; letter-spacing:.06em; text-transform:uppercase; font-family:var(--mono)}
  .pc-stat .n.g{color:var(--accent)}

  /* project cards */
  .proj-cards{display:grid; grid-template-columns:1fr; gap:14px}
  .proj-cards > .card{margin-bottom:0}
  .pcollapse{color:var(--muted); font-size:12px; padding:2px 3px; line-height:1; flex:0 0 auto; transition:.13s}
  .pcollapse:hover{color:var(--ink)}
  .card.collapsed .progress-row{padding-bottom:16px}
  .picon{color:var(--faint); padding:3px; border-radius:7px; display:grid; place-items:center}
  .picon:hover{background:var(--panel-3); color:var(--ink)}
  .card.uncat{border-style:dashed}
  .card.uncat .ptitle{color:var(--muted)}
  .uncat-ico{width:18px;height:18px;display:grid;place-items:center;color:var(--muted);opacity:.7;flex:0 0 auto}
  .done-bar{display:flex; align-items:center; gap:8px; padding:9px 19px; color:var(--faint); font-size:12px; cursor:pointer; user-select:none; border-top:1px solid var(--line)}
  .done-bar:hover{color:var(--muted)}
  .done-bar .caret{transition:transform .2s; font-size:10px}
  .done-bar.open .caret{transform:rotate(90deg)}
  .done-list{padding:2px 9px}
  .mv-sel{border:1px solid transparent; background:none; color:var(--faint); border-radius:7px; font-size:12px; padding:3px 4px; cursor:pointer}
  .mv-sel:hover{border-color:var(--line-2); color:var(--ink)}
  .g-created{font-size:11.5px; color:var(--faint); font-family:var(--mono)}

  /* working cards */
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); margin-bottom:14px; overflow:hidden; scroll-margin-top:16px; transition:border .16s}
  .card:hover{border-color:var(--line-2)}
  .card.flash{animation:flash 1.6s ease}
  @keyframes flash{0%,100%{box-shadow:none}25%{box-shadow:0 0 0 1px var(--accent)}}
  .card.done{opacity:.55}
  .phead{display:flex; align-items:center; gap:10px; padding:15px 19px 12px; flex-wrap:wrap; cursor:pointer}
  .pstar{font-size:15px; line-height:1; color:var(--faint); padding:0; opacity:.55; transition:.13s}
  .pstar:hover{opacity:1}
  .pstar.on{color:var(--star); opacity:1}
  .ptitle{font-weight:600; font-size:16px; flex:1; min-width:200px; outline:none; padding:2px 4px; border-radius:6px; cursor:text}
  .ptitle:focus{background:var(--panel-2)}
  .ptitle:empty:before{content:"Untitled project"; color:var(--faint)}
  .pmeta{display:flex; align-items:center; gap:6px; margin-left:auto; opacity:.5; transition:.13s}
  .card:hover .pmeta{opacity:1}
  .date-min{border:1px solid var(--line); background:var(--panel-2); border-radius:8px; padding:4px 8px; font-size:11.5px; color:var(--muted); font-family:var(--mono)}
  .date-min:hover{border-color:var(--line-2)}
  .pdel{color:var(--faint); font-size:14px; padding:3px 7px; border-radius:7px}
  .pdel:hover{background:rgba(232,117,107,.13); color:var(--danger)}
  .progress-row{display:flex; align-items:center; gap:11px; padding:0 19px 14px; cursor:pointer}
  .bar{flex:1; height:4px; background:var(--panel-3); border-radius:20px; overflow:hidden}
  .bar > i{display:block; height:100%; background:var(--accent); border-radius:20px; transition:width .3s}
  .progress-num{font-size:11.5px; color:var(--faint); white-space:nowrap; font-family:var(--mono)}

  .todos{padding:2px 9px}
  .todo{display:flex; align-items:center; gap:11px; padding:10px 10px; border-radius:10px}
  .todo:hover{background:var(--panel-2)}
  .cbx{appearance:none; width:17px; height:17px; border:1.5px solid var(--line-2); border-radius:6px; flex:0 0 auto; position:relative; cursor:pointer; transition:.14s}
  .cbx:checked{background:var(--accent); border-color:var(--accent)}
  .cbx:checked:after{content:"✓"; color:#08130d; font-size:11px; font-weight:800; position:absolute; left:2.5px; top:-1px}
  .tstar{font-size:13px; color:var(--faint); padding:0 1px; flex:0 0 auto; line-height:1; opacity:0; transition:.13s}
  .todo:hover .tstar{opacity:.5}
  .tstar:hover{opacity:1!important}
  .tstar.on{color:var(--star); opacity:1}
  .ttext{flex:1; min-width:140px; outline:none; padding:3px 4px; border-radius:6px; font-size:14.5px; overflow-wrap:anywhere}
  .ttext:focus{background:var(--panel-3)}
  .todo.tdone .ttext{text-decoration:line-through; color:var(--faint)}
  .ddl-tag{font-size:10.5px; padding:3px 9px; border-radius:20px; white-space:nowrap; cursor:pointer; font-family:var(--mono); letter-spacing:.02em}
  .ddl-add{font-size:11px; color:var(--faint); cursor:pointer; padding:3px 8px; border-radius:7px; border:1px solid var(--line); opacity:0; transition:.13s; font-family:var(--mono)}
  .todo:hover .ddl-add{opacity:1}
  .ddl-add:hover{color:var(--accent-ink); border-color:var(--line-2)}
  .ddl-live{border:1px solid var(--accent); background:var(--panel-3); border-radius:8px; padding:3px 7px; font-size:11.5px; font-family:var(--mono); color:var(--ink)}
  .row-act{display:flex; gap:3px; opacity:0; transition:.13s}
  .todo:hover .row-act{opacity:1}
  .row-act button{color:var(--faint); font-size:12px; padding:3px 7px; border-radius:7px}
  .row-act button:hover{background:var(--panel-3); color:var(--ink)}
  .tdel:hover{background:rgba(232,117,107,.13)!important; color:var(--danger)!important}
  .add-todo{display:flex; padding:5px 15px 14px}
  .add-todo input{flex:1; border:none; background:none; padding:7px 4px; font-size:14.5px; color:var(--ink)}
  .add-todo input::placeholder{color:var(--faint)}
  .add-todo input:focus{outline:none}

  .notes-bar{display:flex; align-items:center; gap:9px; padding:11px 19px; border-top:1px solid var(--line); color:var(--faint); font-size:12px; user-select:none}
  .notes-bar:hover{color:var(--muted)}
  .notes-bar .caret{transition:transform .2s; font-size:10px}
  .notes-bar.open .caret{transform:rotate(90deg)}
  .notes-has{color:var(--accent-ink)}
  .notes-wrap{padding:2px 19px 18px}
  .notes-view{border:1px solid var(--line); border-radius:12px; padding:14px 16px; background:var(--panel-2); min-height:42px; font-size:13px; color:var(--muted); line-height:1.7; cursor:text}
  .notes-view h3,.notes-view h4,.notes-view h5{margin:.6em 0 .3em; font-size:13px; color:var(--ink)}
  .notes-view p{margin:.35em 0} .notes-view ul{margin:.35em 0; padding-left:20px}
  .notes-view code{background:var(--panel-3); padding:1px 6px; border-radius:6px; font-size:12px; font-family:var(--mono)}
  .notes-view a{color:var(--accent-ink)}
  .notes-view .muted{color:var(--faint)}
  .notes-edit{width:100%; min-height:150px; border:1px solid var(--line-2); border-radius:12px; padding:14px 16px; resize:vertical; line-height:1.65; background:var(--panel-2); color:var(--ink)}
  .notes-edit:focus{outline:none; border-color:var(--accent)}
  .notes-hint{font-size:11px; color:var(--faint); margin-top:8px; font-family:var(--mono)}

  /* table */
  .tbl-tools{display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap}
  .seg{display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:3px}
  .seg button{padding:6px 14px; border-radius:7px; font-size:12px; color:var(--muted)}
  .seg button.on{background:var(--panel-3); color:var(--ink)}
  .grp-toggle{border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:9px; padding:7px 12px; font-size:12px}
  .grp-toggle:hover{border-color:var(--line-2); color:var(--ink)}
  .grp-toggle.on{background:var(--panel-3); color:var(--ink); border-color:var(--line-2)}
  table.grid{width:100%; border-collapse:separate; border-spacing:0; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
  table.grid th{position:sticky; top:0; background:var(--panel); text-align:left; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:500; font-family:var(--mono); padding:13px 14px; border-bottom:1px solid var(--line); cursor:pointer; user-select:none; white-space:nowrap}
  table.grid th:hover{color:var(--muted)}
  table.grid td{padding:9px 14px; border-bottom:1px solid var(--line); vertical-align:middle}
  table.grid tr:last-child td{border-bottom:none}
  table.grid tr:hover td{background:var(--panel-2)}
  tr.grp td{background:var(--panel-2); font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); padding:9px 14px}
  tr.grp:hover td{background:var(--panel-2)}
  .grp-n{color:var(--faint); margin-left:6px}
  .g-check{appearance:none; width:16px;height:16px;border:1.5px solid var(--line-2);border-radius:5px;position:relative;cursor:pointer}
  .g-check:checked{background:var(--accent);border-color:var(--accent)}
  .g-check:checked:after{content:"✓";color:#08130d;font-size:10px;font-weight:800;position:absolute;left:2.5px;top:-1.5px}
  .g-star{font-size:13px;color:var(--faint);opacity:.5} .g-star:hover{opacity:1} .g-star.on{color:var(--star);opacity:1}
  .g-text{outline:none; padding:2px 4px; border-radius:6px; min-width:120px; display:block; overflow-wrap:anywhere; font-size:14.5px}
  .g-text:focus{background:var(--panel-3)}
  tr.r-done .g-text{text-decoration:line-through; color:var(--faint)}
  .g-sel{border:1px solid transparent; background:none; border-radius:7px; padding:4px 6px; font-size:12.5px; color:var(--muted); max-width:180px}
  .g-sel:hover{border-color:var(--line-2)}
  .g-date{border:1px solid transparent; background:none; border-radius:7px; padding:4px 5px; font-size:11.5px; color:var(--muted); font-family:var(--mono)}
  .g-date:hover{border-color:var(--line-2)}
  .g-defer{color:var(--faint); font-size:11.5px; padding:3px 8px; border-radius:7px; opacity:0}
  tr:hover .g-defer{opacity:1}
  .g-defer:hover{background:var(--panel-3); color:var(--ink)}

  /* range bar (in Tasks) */
  .week-nav{display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 14px}
  .wk-chip{padding:6px 11px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--muted); font-size:12px}
  .wk-chip:hover{border-color:var(--line-2); color:var(--ink)}
  .wk-chip.on{background:var(--panel-3); color:var(--ink); border-color:var(--line-2)}
  .wk-div{width:1px; height:20px; background:var(--line); margin:0 3px}
  .wk-lbl{font-size:11px; color:var(--faint); font-family:var(--mono)}
  .wk-date{border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:5px 8px; font-size:12px; font-family:var(--mono); color:var(--muted); cursor:pointer}
  .wk-date:hover{border-color:var(--line-2)}

  @media(max-width:1080px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}

<script>
"use strict";
/* Task Manager — a calm, project-first task board. Single file, no build, data in localStorage. */
const LS_KEY='taskmanager.tasks';
const THEME_KEY='taskmanager.theme';

const ICONS={
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  star:'<path d="M12 3.5l2.6 5.9 6.4.6-4.8 4.2 1.4 6.3L12 17.4 6.4 20.5l1.4-6.3L3 10l6.4-.6z"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
  table:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.5h18M9 9.5V20"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>',
  inbox:'<path d="M3 12l3-8h12l3 8v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 12h5l1.5 2.5h5L16 12h5"/>',
  trash:'<path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6"/><path d="M10 11v6M14 11v6"/>',
};
function svg(name){return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;}
const GRIP='<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="2.5" cy="3" r="1.2"/><circle cx="7.5" cy="3" r="1.2"/><circle cx="2.5" cy="8" r="1.2"/><circle cx="7.5" cy="8" r="1.2"/><circle cx="2.5" cy="13" r="1.2"/><circle cx="7.5" cy="13" r="1.2"/></svg>';
const ARCHIVE_ICON='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/></svg>';
const SUN='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.3 1.3M17.8 17.8l1.3 1.3M4.9 19.1l1.3-1.3M17.8 6.2l1.3-1.3"/></svg>';
const MOON='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
const CLOUD='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg>';

/* ---------------- drag to reorder ---------------- */
let _drag=null;
function enableSortable(container,itemSel,idAttr,commit){
  if(!container)return;
  container.querySelectorAll(itemSel).forEach(item=>{
    const h=item.querySelector('.drag');if(!h)return;
    h.setAttribute('draggable','true');
    h.addEventListener('dragstart',e=>{_drag={container};item.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','x');}catch(_){}
      try{const r=item.getBoundingClientRect();e.dataTransfer.setDragImage(item,e.clientX-r.left,e.clientY-r.top);}catch(_){}});
    h.addEventListener('dragend',()=>{item.classList.remove('dragging');if(_drag&&_drag.container===container){const ids=[...container.querySelectorAll(itemSel)].map(el=>el.getAttribute(idAttr));commit(ids);}_drag=null;});
  });
  if(container._sortBound)return;container._sortBound=true;
  container.addEventListener('dragover',e=>{if(!_drag||_drag.container!==container)return;e.preventDefault();
    const dg=container.querySelector('.dragging');if(!dg)return;
    const ref=sortAfter(container,itemSel,e.clientX,e.clientY);
    if(ref===dg)return;
    if(ref==null)container.appendChild(dg);else container.insertBefore(dg,ref);});
}
function sortAfter(container,itemSel,x,y){
  const els=[...container.querySelectorAll(itemSel+':not(.dragging)')];
  if(!els.length)return null;
  let best=null,bd=Infinity;
  for(const el of els){const b=el.getBoundingClientRect();const cx=b.left+b.width/2,cy=b.top+b.height/2;const d=(x-cx)**2+(y-cy)**2;if(d<bd){bd=d;best=el;}}
  const b=best.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;
  const before=(y<cy-2)||(Math.abs(y-cy)<=b.height/2&&x<cx);
  return before?best:best.nextElementSibling;
}

/* ---------------- seed ---------------- */
function seed(){
  const D=(n)=>addDays(todayStr(),n);
  const P=(title,star,notes,todos)=>({
    id:uid(),title,star:!!star,target:'',notes:notes||'',collapsed:false,archived:false,createdAt:todayStr(),
    todos:(todos||[]).map(t=>{const a=Array.isArray(t)?t:[t];const done=!!a[3];return {id:uid(),text:a[0],done,doneAt:done?todayStr():'',star:!!a[1],ddl:a[2]||'',createdAt:todayStr()};})
  });
  const projects=[
    P('Personal website redesign',true,
      'Goal: a cleaner, faster one-page site.\nInspiration: https://linear.app and https://stripe.com\n\nThis area takes **bold**, - lists, # headings and links — paste anything relevant here.',
      [['Write the new homepage copy',true,D(1)],['Pick a color palette',false,D(3)],['Choose a font pairing',false,'',true],['Ship the first draft',false,D(6)]]),
    P('Q3 content plan',true,'',
      [['Draft the blog calendar',true,D(2)],['Outline the newsletter',false,D(4)],'Line up two guest posts',['Pick the quarter themes',false,'',true]]),
    P('Move to the new apartment',true,'',
      [['Book the movers',true,D(-1)],['Set up mail forwarding',false,D(5)],'Cancel the old utilities','Measure the living room']),
    P('Learn Spanish',false,'',
      [['Finish this week lessons',false,D(4)],'Watch one show with subtitles',['Set a daily reminder',false,'',true]]),
    P('Reading list',false,'Books to get through this year.',
      ['Finish Thinking, Fast and Slow','Start Atomic Habits','Note three takeaways from each']),
    P('Weekend trip',false,'',
      [['Book the train tickets',false,D(5)],'Make a rough itinerary','Find a place to stay']),
    P('Side project: recipe app',false,
      'A tiny app to save and search recipes. Start with a single-page prototype.',
      ['Sketch the data model','Design the recipe card','Set up the repo']),
  ];
  const quick=['Reply to the landlord','Renew the library card','Research standing desks','Back up phone photos','Book a dentist appointment']
    .map(t=>({id:uid(),text:t,done:false,doneAt:'',star:false,ddl:'',notes:'',createdAt:todayStr()}));
  return {version:3, owner:'', projects, quick, trash:[]};
}

/* ---------------- utils ---------------- */
let _idc=0;
function uid(){_idc++;return 'id'+Date.now().toString(36)+'-'+_idc.toString(36)+'-'+Math.floor(performance.now()).toString(36);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseYMD(s){if(!s)return null;const p=String(s).split('-').map(Number);if(p.length<3||isNaN(p[0]))return null;return new Date(p[0],p[1]-1,p[2]);}
function fmtMD(s){const d=parseYMD(s);return d?(d.getMonth()+1)+'/'+d.getDate():'';}
function dayDiff(s){const d=parseYMD(s);if(!d)return null;return Math.round((d-parseYMD(todayStr()))/86400000);}
function addDays(s,n){const d=parseYMD(s)||parseYMD(todayStr());d.setDate(d.getDate()+n);return ymd(d);}
function addMonths(s,n){const d=parseYMD(s)||parseYMD(todayStr());d.setMonth(d.getMonth()+n);return ymd(d);}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtRange(f,t){return fmtMD(f)+' – '+fmtMD(t);}
function weekBounds(off){off=off||0;const t=parseYMD(todayStr());const dow=(t.getDay()+6)%7;const mon=new Date(t);mon.setDate(t.getDate()-dow+off*7);const sun=new Date(mon);sun.setDate(mon.getDate()+6);return{mon,sun};}
function inWeek(s,off){const d=parseYMD(s);if(!d)return false;const{mon,sun}=weekBounds(off);return d>=mon&&d<=sun;}
function isThisWeek(s){return inWeek(s,0);}
function tablePresets(){const w0=weekBounds(0),w1=weekBounds(-1),d=parseYMD(todayStr());
  const mf=ymd(new Date(d.getFullYear(),d.getMonth(),1)),mt=ymd(new Date(d.getFullYear(),d.getMonth()+1,0));
  const lmf=ymd(new Date(d.getFullYear(),d.getMonth()-1,1)),lmt=ymd(new Date(d.getFullYear(),d.getMonth(),0));
  return [{label:'This week',from:ymd(w0.mon),to:ymd(w0.sun)},{label:'Last week',from:ymd(w1.mon),to:ymd(w1.sun)},
    {label:'This month',from:mf,to:mt},{label:'Last month',from:lmf,to:lmt}];}
function recentMonths(n){const d=parseYMD(todayStr());const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const out=[];for(let i=0;i<n;i++){const dt=new Date(d.getFullYear(),d.getMonth()-i,1);out.push({label:M[dt.getMonth()]+' '+dt.getFullYear(),from:ymd(dt),to:ymd(new Date(dt.getFullYear(),dt.getMonth()+1,0))});}return out;}
function ddlClass(s){const n=dayDiff(s);if(n===null)return'';if(n<0)return'overdue';if(n===0)return'today-tag';if(n<=7)return'soon';return'later';}
function ddlLabel(s){const n=dayDiff(s);if(n===null)return'';if(n<0)return fmtMD(s)+' · '+(-n)+'d late';if(n===0)return'Today';if(n===1)return'Tomorrow';return fmtMD(s);}

function markdown(src){
  if(!src||!src.trim())return '<span class="muted">No context yet. Click to edit — paste messages, links, docs, thoughts…</span>';
  const lines=esc(src).split('\n');let html='',inList=false;
  const inline=t=>t
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])((https?:\/\/)[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+?)`/g,'<code>$1</code>');
  for(const raw of lines){
    if(/^\s*[-*]\s+/.test(raw)){if(!inList){html+='<ul>';inList=true;}html+='<li>'+inline(raw.replace(/^\s*[-*]\s+/,''))+'</li>';continue;}
    if(inList){html+='</ul>';inList=false;}
    if(/^#{1,3}\s+/.test(raw)){const lv=raw.match(/^#+/)[0].length;html+='<h'+(lv+2)+'>'+inline(raw.replace(/^#+\s+/,''))+'</h'+(lv+2)+'>';}
    else if(raw.trim()==='')html+='';else html+='<p>'+inline(raw)+'</p>';
  }
  if(inList)html+='</ul>';return html;
}

/* ---------------- state ---------------- */
let state=seed();
let view='week', query='', sortBy='manual', filterStar=false;
let tableStatus='all', tableSort='project', tableFrom='', tableTo='', tableGroup=false, tblCustom=false;
let projStatus='active', uncatCollapsed=true;
let pendingFocus=null, pendingScroll=null;

function migrate(o){
  if(!o||typeof o!=='object')return seed();
  o.version=3; o.owner='';
  o.projects=Array.isArray(o.projects)?o.projects:[]; o.quick=Array.isArray(o.quick)?o.quick:[];
  o.projects.forEach(p=>{p.id=p.id||uid();p.todos=Array.isArray(p.todos)?p.todos:[];p.notes=p.notes||'';
    p.star=p.star!==undefined?!!p.star:false;p.target=p.target||'';p.collapsed=!!p.collapsed;p.archived=!!p.archived;p.createdAt=p.createdAt||'';
    p.todos.forEach(t=>{t.id=t.id||uid();t.ddl=t.ddl||'';t.done=!!t.done;t.doneAt=t.doneAt||(t.done?todayStr():'');t.createdAt=t.createdAt||'';
      t.star=t.star!==undefined?!!t.star:false;});});
  o.quick.forEach(q=>{q.id=q.id||uid();q.ddl=q.ddl||'';q.done=!!q.done;q.doneAt=q.doneAt||(q.done?todayStr():'');q.notes=q.notes||'';q.createdAt=q.createdAt||'';q.star=q.star!==undefined?!!q.star:false;});
  o.trash=Array.isArray(o.trash)?o.trash:[];
  return o;
}

/* ---------------- persistence ---------------- */
let saveTimer=null;
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}clearTimeout(saveTimer);saveTimer=setTimeout(saveToFile,700);}
let fileHandle=null;
const idb={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('taskmanager',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
};
async function permit(h){try{if(!h.queryPermission)return true;const o={mode:'readwrite'};if(await h.queryPermission(o)==='granted')return true;if(await h.requestPermission(o)==='granted')return true;}catch(e){}return false;}
async function saveToFile(){if(!fileHandle)return;try{if(!await permit(fileHandle))return;const w=await fileHandle.createWritable();await w.write(JSON.stringify(state,null,2));await w.close();}catch(e){console.warn(e);}}
async function bindFile(){
  if(!window.showSaveFilePicker){alert('File sync needs Chrome or Edge on desktop.');return;}
  let handle;
  try{handle=await window.showSaveFilePicker({suggestedName:'tasks.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});}catch(e){return;}
  fileHandle=handle;await idb.set('fileHandle',handle);
  try{const file=await handle.getFile();const txt=(await file.text()).trim();
    if(txt){state=migrate(JSON.parse(txt));save();renderAll();toast('Synced \u00b7 loaded your data from this file');}
    else{await saveToFile();toast('Synced \u00b7 this file now holds your data');}
  }catch(e){await saveToFile();toast('Synced to file');}
  updateStoragePill();
}
async function restoreFile(){
  try{const h=await idb.get('fileHandle');if(!h)return false;fileHandle=h;
    if(await permit(h)){const f=await h.getFile();const txt=await f.text();if(txt.trim()){state=migrate(JSON.parse(txt));return true;}}
  }catch(e){console.warn(e);}return false;
}
function updateStoragePill(){const el=document.getElementById('storagePill');if(el){el.innerHTML=fileHandle?'\u2713 Synced \u00b7 <b>'+esc(fileHandle.name)+'</b>':'\u21bb Sync tasks to a file \u2192';el.title=fileHandle?'Auto-saving to this file':'Save your tasks to a Drive file so they follow you across devices';el.onclick=bindFile;}}

/* ---------------- helpers ---------------- */
const findProj=id=>state.projects.find(p=>p.id===id);
function projDone(p){return p.todos.length>0&&p.todos.every(t=>t.done);}
function setDone(t,v){t.done=v;t.doneAt=v?todayStr():'';}
function allRows(){const a=[];state.projects.forEach(p=>p.todos.forEach(t=>a.push({t,p})));state.quick.forEach(q=>a.push({t:q,p:null}));return a;}
function openRows(){return allRows().filter(x=>!x.t.done);}
function matchQ(t){return !query||String(t).toLowerCase().includes(query.toLowerCase());}
function rowSearch(x){return matchQ(x.t.text)||(x.p&&matchQ(x.p.title));}
function maxTaskDdl(p){let m='';p.todos.forEach(t=>{if(t.ddl&&t.ddl>m)m=t.ddl;});return m;}
function effTarget(p){const m=maxTaskDdl(p);return (p.target||'')>m?p.target:m;}   /* deadline auto-extends to latest task */
function newProject(title){return {id:uid(),title:title||'',star:false,target:addMonths(todayStr(),1),notes:'',collapsed:false,archived:false,createdAt:todayStr(),todos:[]};}
function newTask(text){return {id:uid(),text,done:false,doneAt:'',star:false,ddl:addDays(todayStr(),7),createdAt:todayStr()};}
function trashTask(pid,t){removeTodo(pid,t);const p=pid==='__quick__'?null:findProj(pid);state.trash.unshift({id:uid(),kind:'task',item:t,fromPid:pid,projTitle:p?p.title:'Uncategorized',at:todayStr()});}
function trashProject(p){state.projects=state.projects.filter(x=>x!==p);state.trash.unshift({id:uid(),kind:'project',item:p,at:todayStr()});}
function restoreTrash(e){state.trash=state.trash.filter(x=>x!==e);if(e.kind==='task'){const pid=e.fromPid;if(pid!=='__quick__'&&findProj(pid))findProj(pid).todos.push(e.item);else state.quick.unshift(e.item);}else state.projects.unshift(e.item);}
let toastTimer=null;
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1900);}

/* ---------------- sidebar ---------------- */
function renderSidebar(){
  const focusCount=openRows().filter(x=>x.t.star&&(!x.p||!x.p.archived)).length;
  const weekCount=openRows().filter(x=>{if(x.p&&x.p.archived)return false;if(!x.t.ddl)return false;const dd=dayDiff(x.t.ddl);return dd!==null&&(dd<0||isThisWeek(x.t.ddl));}).length;
  const projCount=state.projects.filter(p=>!p.archived).length;
  const nav=[
    {k:'dash',ic:'grid',label:'Overview',count:''},
    {k:'focus',ic:'star',label:'Focus',count:focusCount||''},
    {k:'week',ic:'clock',label:'This Week',count:weekCount||''},
    {k:'all',ic:'layers',label:'Projects',count:projCount},
    {k:'table',ic:'table',label:'Tasks',count:''},
  ];
  let h='';
  nav.forEach(n=>{h+=`<div class="nav-item ${view===n.k?'active':''}" data-view="${n.k}"><span class="ico">${svg(n.ic)}</span><span>${n.label}</span>${n.count!==''?`<span class="count">${n.count}</span>`:''}</div>`;});
  h+='<div class="nav-sep"></div>';
  h+=`<div class="nav-item ${view==='trash'?'active':''}" data-view="trash"><span class="ico">${svg('trash')}</span><span>Trash</span>${state.trash.length?`<span class="count">${state.trash.length}</span>`:''}</div>`;
  h+='<div class="nav-sep"></div><div class="storage-pill" id="storagePill"></div><a class="credit" href="https://github.com/septemberfd" target="_blank" rel="noopener">Created by septemberfd ↗</a>';
  const sb=document.getElementById('sidebar');sb.innerHTML=h;
  sb.querySelectorAll('.nav-item').forEach(el=>el.onclick=()=>{view=el.dataset.view;renderAll();});
  updateStoragePill();
}

/* ---------------- shared bits ---------------- */
function ddlChip(t){if(!t.ddl)return `<button class="ddl-add" data-role="ddl">+ date</button>`;const cls=t.done?'later':ddlClass(t.ddl);const lab=t.done?fmtMD(t.ddl):ddlLabel(t.ddl);return `<button class="ddl-tag ${cls}" data-role="ddl">${esc(lab)}</button>`;}
function projOptions(cur){let o='';state.projects.forEach(p=>o+=`<option value="${p.id}" ${p.id===cur?'selected':''}>${esc(p.title||'Untitled')}</option>`);o+=`<option value="__quick__" ${cur==='__quick__'?'selected':''}>Uncategorized</option><option value="__new__">+ New project…</option>`;return o;}
function moveSelectHTML(cur){let o=`<option value="" selected>→</option><option value="__quick__">Uncategorized</option>`;state.projects.forEach(p=>{if(p.id!==cur)o+=`<option value="${p.id}">${esc(p.title||'Untitled')}</option>`;});o+=`<option value="__new__">+ New project…</option>`;return `<select class="mv-sel" data-role="move" title="Move to…">${o}</select>`;}

function todoRowHTML(t,pid,showProj){
  return `<div class="todo ${t.done?'tdone':''}" data-tid="${t.id}" data-pid="${pid}">
    <span class="drag" data-role="drag" title="Drag to reorder">${GRIP}</span>
    <input type="checkbox" class="cbx" data-role="check" ${t.done?'checked':''}>
    <button class="tstar ${t.star?'on':''}" data-role="tstar" title="Important (Focus)">${t.star?'★':'☆'}</button>
    <div class="ttext" contenteditable="true" data-role="text">${esc(t.text)}</div>
    ${showProj?`<span class="proj-tag">${esc(showProj)}</span>`:''}
    <span class="ddl-slot" data-role="ddl-slot">${ddlChip(t)}</span>
    <span class="row-act">${moveSelectHTML(pid)}<button data-role="defer" title="Push 1 week">»</button><button class="tdel" data-role="del" title="Delete">×</button></span>
  </div>`;
}

function projectCardHTML(p){
  const openT=p.todos.filter(t=>!t.done), doneT=p.todos.filter(t=>t.done);
  const total=p.todos.length, dn=doneT.length, pct=total?Math.round(dn/total*100):0;
  const col=!!p.collapsed, has=p.notes&&p.notes.trim();
  const et=effTarget(p);
  const target=et?`<input type="date" class="date-min" data-role="target" value="${et}" title="Project deadline (auto-extends to the latest task)">`
                 :`<input type="date" class="date-min" data-role="target" value="" title="Project deadline" style="width:30px">`;
  return `<div class="card ${projDone(p)?'done':''} ${col?'collapsed':''}" data-pid="${p.id}">
    <div class="phead" data-role="head">
      <button class="pcollapse" data-role="collapse" title="${col?'Expand':'Collapse'}">${col?'▸':'▾'}</button>
      ${view==='all'?`<span class="drag" data-role="drag" title="Drag to reorder">${GRIP}</span>`:''}
      <button class="pstar ${p.star?'on':''}" data-role="star" title="Important (Focus)">${p.star?'★':'☆'}</button>
      <div class="ptitle" contenteditable="true" data-role="title">${esc(p.title)}</div>
      <div class="pmeta">${target}
        <button class="picon" data-role="archive" title="${p.archived?'Unarchive':'Archive'}">${ARCHIVE_ICON}</button>
        <button class="pdel" data-role="pdel" title="Delete project (to Trash)">✕</button></div>
    </div>
    <div class="progress-row" data-role="pbar"><div class="bar"><i style="width:${pct}%"></i></div><span class="progress-num">${dn}/${total} · ${pct}%</span></div>
    ${col?'':`<div class="todos">${openT.map(t=>todoRowHTML(t,p.id,'')).join('')}</div>
    <div class="add-todo"><input data-role="add-todo" placeholder="+ Add a task, press Enter"></div>
    ${dn?`<div class="done-bar" data-role="done-toggle"><span class="caret">▸</span>✓ ${dn} done</div><div class="done-list" data-role="done-list" hidden>${doneT.map(t=>todoRowHTML(t,p.id,'')).join('')}</div>`:''}
    <div class="notes-bar" data-role="notes-toggle"><span class="caret">▸</span><span class="${has?'notes-has':''}">Context / notes${has?' · filled':''}</span></div>
    <div class="notes-wrap" data-role="notes-wrap" hidden></div>`}
  </div>`;
}

function uncatCardHTML(){
  const openT=state.quick.filter(t=>!t.done), doneT=state.quick.filter(t=>t.done);
  const total=state.quick.length, dn=doneT.length, col=uncatCollapsed;
  return `<div class="card uncat ${col?'collapsed':''}" data-uncat="1">
    <div class="phead" data-role="head">
      <button class="pcollapse" data-role="collapse" title="${col?'Expand':'Collapse'}">${col?'▸':'▾'}</button>
      <span class="uncat-ico">${svg('inbox')}</span>
      <div class="ptitle" style="cursor:default">Uncategorized</div>
      <div class="pmeta" style="opacity:1"><span class="progress-num">${dn}/${total} · triage into projects</span></div>
    </div>
    ${col?'':`<div class="todos">${openT.map(t=>todoRowHTML(t,'__quick__','')).join('')}</div>
    <div class="add-todo"><input data-role="uncat-add" placeholder="+ Add a loose task, press Enter"></div>
    ${dn?`<div class="done-bar" data-role="done-toggle"><span class="caret">▸</span>✓ ${dn} done</div><div class="done-list" data-role="done-list" hidden>${doneT.map(t=>todoRowHTML(t,'__quick__','')).join('')}</div>`:''}`}
  </div>`;
}

/* ---------------- filters/sort ---------------- */
function visibleProjects(list){
  let ps=list.slice();
  if(query)ps=ps.filter(p=>matchQ(p.title)||matchQ(p.notes)||p.todos.some(t=>matchQ(t.text)));
  if(sortBy==='star')ps=ps.sort((a,b)=>(b.star?1:0)-(a.star?1:0));
  else if(sortBy==='target')ps=ps.sort((a,b)=>(effTarget(a)||'9999').localeCompare(effTarget(b)||'9999'));
  else if(sortBy==='progress')ps=ps.sort((a,b)=>prog(a)-prog(b));
  return ps;
}
function prog(p){return p.todos.length?p.todos.filter(t=>t.done).length/p.todos.length:0;}
function headTools(showAdd){
  return `<div class="view-tools">
    <select class="sortsel" id="sortSel">
      <option value="manual" ${sortBy==='manual'?'selected':''}>Manual order</option>
      <option value="star" ${sortBy==='star'?'selected':''}>Starred first</option>
      <option value="target" ${sortBy==='target'?'selected':''}>By deadline</option>
      <option value="progress" ${sortBy==='progress'?'selected':''}>By progress</option>
    </select>
    ${showAdd?`<button class="btn-primary" id="addProj">+ New project</button>`:''}
  </div>`;
}

/* ================= MAIN ================= */
function renderMain(){
  const m=document.getElementById('wrap');
  if(view==='dash')return renderDash(m);
  if(view==='table')return renderTable(m);
  if(view==='focus')return renderFocus(m);
  if(view==='week')return renderWeek(m);
  if(view==='trash')return renderTrash(m);
  return renderProjects(m);
}
function renderTrash(m){
  let h=`<div class="view-head"><div><div class="view-title">Trash</div><div class="view-sub">Deleted tasks and projects wait here — restore anytime. Nothing clears automatically; empty it yourself when you're sure.</div></div>${state.trash.length?`<div class="view-tools"><button class="btn-danger" id="emptyTrash">Empty trash (${state.trash.length})</button></div>`:''}</div>`;
  if(!state.trash.length)h+=emptyBox('🗑','Trash is empty','Deleted tasks and projects show up here — restorable anytime, never auto-purged.');
  else{h+=`<div class="flat">`;
    state.trash.forEach(e=>{const isP=e.kind==='project';
      const label=isP?esc(e.item.title||'Untitled project'):esc(e.item.text);
      const sub=isP?`Project · ${e.item.todos.length} task${e.item.todos.length!==1?'s':''}`:`Task · from ${esc(e.projTitle||'Uncategorized')}`;
      h+=`<div class="trash-row" data-eid="${e.id}"><span class="tr-ico">${isP?svg('layers'):'✓'}</span><div class="tr-main"><div class="tr-label">${label}</div><div class="tr-sub">${sub}</div></div><button class="tr-restore" data-role="restore">Restore</button><button class="tr-del" data-role="forever">Delete</button></div>`;});
    h+=`</div>`;}
  m.innerHTML=h;
  const et=document.getElementById('emptyTrash');if(et)et.onclick=()=>{if(confirm('Permanently delete all '+state.trash.length+' items in Trash? This cannot be undone.')){state.trash=[];save();renderAll();toast('Trash emptied');}};
  m.querySelectorAll('.trash-row').forEach(row=>{const e=state.trash.find(x=>x.id===row.dataset.eid);if(!e)return;
    row.querySelector('[data-role=restore]').onclick=()=>{restoreTrash(e);save();renderAll();toast('Restored');};
    row.querySelector('[data-role=forever]').onclick=()=>{state.trash=state.trash.filter(x=>x!==e);save();renderAll();};});
}
function emptyBox(b,t,s){return `<div class="empty"><div class="big">${b}</div><div style="color:var(--muted)">${t}</div><div class="view-sub" style="margin:6px auto 0">${s}</div></div>`;}

/* ---------------- Focus (starred, cross-time) ---------------- */
function renderFocus(m){
  const starTasks=openRows().filter(x=>x.t.star&&(!x.p||!x.p.archived)&&rowSearch(x));
  const starProjects=state.projects.filter(p=>!p.archived&&p.star&&!projDone(p)).filter(p=>!query||matchQ(p.title)||p.todos.some(t=>matchQ(t.text)));
  let h=`<div class="view-head"><div><div class="view-title">Focus</div><div class="view-sub">Everything you starred as important — regardless of date. Tap the ☆ on any task or project to keep it here.</div></div></div>`;
  if(starTasks.length)h+=`<div class="sec-title">Starred tasks <span class="s-count">${starTasks.length}</span></div><div class="flat">`+starTasks.map(x=>todoRowHTML(x.t,x.p?x.p.id:'__quick__',x.p?x.p.title:'Uncategorized')).join('')+`</div>`;
  if(starProjects.length)h+=`<div class="sec-title" style="margin-top:26px">Starred projects <span class="s-count">${starProjects.length}</span></div><div class="proj-cards">`+starProjects.map(projectCardHTML).join('')+`</div>`;
  if(!starTasks.length&&!starProjects.length)h+=emptyBox('☆','Nothing starred yet','Tap the ☆ on any task or project you want to keep in Focus.');
  m.innerHTML=h;wireMain();applyPending();
}

/* ---------------- This Week (time-based, grouped by project) ---------------- */
function renderWeek(m){
  const rows=openRows().filter(x=>{if(x.p&&x.p.archived)return false;if(!x.t.ddl)return false;const dd=dayDiff(x.t.ddl);return dd!==null&&(dd<0||isThisWeek(x.t.ddl));}).filter(rowSearch);
  const groups=new Map();
  rows.forEach(x=>{const key=x.p?x.p.id:'__quick__',title=x.p?x.p.title:'Uncategorized';if(!groups.has(key))groups.set(key,{title,rows:[]});groups.get(key).rows.push(x);});
  const arr=[...groups.values()];
  arr.forEach(g=>g.rows.sort((a,b)=>a.t.ddl.localeCompare(b.t.ddl)));
  arr.sort((a,b)=>a.rows[0].t.ddl.localeCompare(b.rows[0].t.ddl));
  const overdueN=rows.filter(x=>dayDiff(x.t.ddl)<0).length;
  let h=`<div class="view-head"><div><div class="view-title">This Week</div><div class="view-sub">Everything due this week, plus anything overdue — grouped by project.${overdueN?` <b style="color:var(--danger)">${overdueN} overdue.</b>`:''}</div></div></div>`;
  if(!arr.length)h+=emptyBox('◷','Nothing due this week','Tasks with a deadline this week (or overdue) gather here. New tasks default to a deadline a week out.');
  arr.forEach(g=>{h+=`<div class="wk-group"><div class="wk-group-h">${esc(g.title)}<span class="cnt">${g.rows.length}</span></div><div class="flat">`+g.rows.map(x=>todoRowHTML(x.t,x.p?x.p.id:'__quick__','')).join('')+`</div></div>`;});
  m.innerHTML=h;wireMain();applyPending();
}

/* ---------------- Projects (Active/Archived/All + Uncategorized card) ---------------- */
function renderProjects(m){
  let list=state.projects;
  if(projStatus==='active')list=list.filter(p=>!p.archived);
  else if(projStatus==='archived')list=list.filter(p=>p.archived);
  const ps=visibleProjects(list);
  const showUncat=projStatus!=='archived';
  let h=`<div class="view-head"><div><div class="view-title">Projects</div><div class="view-sub">${ps.length} project${ps.length!==1?'s':''}${projStatus!=='active'?' · '+projStatus:''} · click a card header to collapse, drag to reorder</div></div>${headTools(true)}</div>`;
  h+=`<div class="tbl-tools"><div class="seg">
    <button class="${projStatus==='active'?'on':''}" data-ps="active">Active</button>
    <button class="${projStatus==='archived'?'on':''}" data-ps="archived">Archived</button>
    <button class="${projStatus==='all'?'on':''}" data-ps="all">All</button>
  </div></div>`;
  if(ps.length||showUncat){h+=`<div class="proj-cards">`+ps.map(projectCardHTML).join('')+(showUncat?uncatCardHTML():'')+`</div>`;}
  else h+=emptyBox('▤','No archived projects','Archive a project with the box icon to tuck it away here for later.');
  m.innerHTML=h;wireMain();applyPending();
  m.querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>{projStatus=b.dataset.ps;renderMain();renderSidebar();});
}

/* ---------------- dashboard ---------------- */
function renderDash(m){
  const nonArch=state.projects.filter(p=>!p.archived);
  const open=openRows(),done=allRows().filter(x=>x.t.done);
  const active=nonArch.filter(p=>p.todos.some(t=>!t.done));
  const weekDDL=open.filter(x=>x.t.ddl&&(!x.p||!x.p.archived)&&(dayDiff(x.t.ddl)<0||isThisWeek(x.t.ddl)));
  const overdue=weekDDL.filter(x=>dayDiff(x.t.ddl)<0);
  const starOpen=open.filter(x=>x.t.star&&(!x.p||!x.p.archived));
  const doneThisWeek=done.filter(x=>inWeek(x.t.doneAt,0)).length;
  const kpi=(label,num,unit,sub,cls,go)=>`<div class="kpi ${go?'click':''}" ${go?`data-go="${go}"`:''}>
    <div class="k-top"><span class="lbl">${label}</span></div>
    <div class="k-num ${cls||''}">${num}<span class="u">${unit}</span></div>
    <div class="k-sub">${sub}</div></div>`;
  let h=`<div class="dash-hero"><h1>Overview</h1><div class="sub">A calm, project-first task board</div></div>`;
  h+=`<div class="kpi-grid">
    ${kpi('Active projects',active.length,active.length===1?'project':'projects',`of ${nonArch.length} total`,'accent','all')}
    ${kpi('Open tasks',open.length,'left',`${done.length} done`,'')}
    ${kpi('Due this week',weekDDL.length,'tasks',overdue.length?`<b>${overdue.length} overdue</b>`:'on your radar','','week')}
    ${kpi('Starred',starOpen.length,'tasks','important — in Focus','star','focus')}
  </div>`;
  h+=`<div class="sec-title">Done this week <span class="s-count">${doneThisWeek} · for a report, open Tasks → This week → Done → Copy report</span></div>`;
  let list=nonArch.slice();
  if(query)list=list.filter(p=>matchQ(p.title));
  list=list.sort((a,b)=>{const ad=projDone(a),bd=projDone(b);if(ad!==bd)return ad-bd;return (b.star?1:0)-(a.star?1:0);});
  h+=`<div class="sec-title">Project progress <span class="s-count">${list.length}</span></div><div class="proj-grid">`;
  list.forEach(p=>{
    const total=p.todos.length,d=p.todos.filter(t=>t.done).length,openN=total-d,pct=total?Math.round(d/total*100):0;
    h+=`<div class="pcard ${projDone(p)?'c-done':''}" data-jump="${p.id}">
      <button class="pc-x" data-role="pdissolve" title="Delete project (to Trash)">✕</button>
      <div class="pc-head"><span class="pc-dot ${pct===100?'g':''}"></span><div class="pc-title">${esc(p.title||'Untitled')}</div>${p.star?'<span class="pc-star">★</span>':''}</div>
      <div class="pc-pct"><span class="big" style="${pct===100?'color:var(--accent)':''}">${pct}%</span><span class="frac">${d}/${total} done</span></div>
      <div class="pc-bar"><i style="width:${pct}%"></i></div>
      <div class="pc-stats">
        <div class="pc-stat"><div class="n">${total}</div><div class="l">Total</div></div>
        <div class="pc-stat"><div class="n">${openN}</div><div class="l">Open</div></div>
        <div class="pc-stat"><div class="n g">${d}</div><div class="l">Done</div></div>
      </div></div>`;
  });
  h+=`</div>`;
  m.innerHTML=h;
  m.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{view=el.dataset.go;renderAll();});
  m.querySelectorAll('.pcard').forEach(card=>{
    const id=card.dataset.jump;
    card.querySelector('[data-role=pdissolve]').onclick=e=>{e.stopPropagation();const p=findProj(id);if(p){trashProject(p);save();renderAll();toast('Project moved to Trash');}};
    card.onclick=()=>{view='all';pendingScroll=id;renderAll();};
  });
}

/* ---------------- table (Tasks) ---------------- */
function tableRowHTML(x){const t=x.t,pid=x.p?x.p.id:'__quick__';
  return `<tr class="${t.done?'r-done':''}" data-tid="${t.id}" data-pid="${pid}">
    <td><input type="checkbox" class="g-check" data-role="check" ${t.done?'checked':''}></td>
    <td><button class="g-star ${t.star?'on':''}" data-role="star">${t.star?'★':'☆'}</button></td>
    <td><div class="g-text" contenteditable="true" data-role="text">${esc(t.text)}</div></td>
    <td><select class="g-sel" data-role="move">${projOptions(pid)}</select></td>
    <td><span class="g-created">${t.createdAt?fmtMD(t.createdAt):'—'}</span></td>
    <td><input type="date" class="g-date" data-role="ddl" value="${t.ddl||''}"></td>
    <td><button class="g-defer" data-role="defer" title="Push 1 week">push »</button></td>
  </tr>`;}
function renderTable(m){
  const rangeOn=!!(tableFrom&&tableTo);
  let rows=allRows();
  if(rangeOn)rows=rows.filter(x=>{const d=x.t.done?x.t.doneAt:x.t.ddl;return d&&d>=tableFrom&&d<=tableTo;});
  if(tableStatus==='open')rows=rows.filter(x=>!x.t.done);
  else if(tableStatus==='done')rows=rows.filter(x=>x.t.done);
  else if(tableStatus==='uncat')rows=rows.filter(x=>!x.p&&!x.t.done);
  if(query)rows=rows.filter(rowSearch);
  const cmp={
    project:(a,b)=>(a.p?a.p.title:'~').localeCompare(b.p?b.p.title:'~'),
    star:(a,b)=>(b.t.star?1:0)-(a.t.star?1:0),
    created:(a,b)=>(b.t.createdAt||'').localeCompare(a.t.createdAt||''),
    ddl:(a,b)=>(a.t.ddl||'9999').localeCompare(b.t.ddl||'9999'),
    text:(a,b)=>a.t.text.localeCompare(b.t.text),
  }[tableSort]||(()=>0);
  rows=rows.slice().sort(cmp);
  let h=`<div class="view-head"><div><div class="view-title">Tasks</div><div class="view-sub">One list for everything — filter by status or time period, group by project, star, edit dates, or reassign. <b style="color:var(--muted)">Uncategorized</b> = your inbox to triage.</div></div></div>`;
  h+=`<div class="tbl-tools"><div class="seg">
    <button class="${tableStatus==='all'?'on':''}" data-st="all">All</button>
    <button class="${tableStatus==='open'?'on':''}" data-st="open">To do</button>
    <button class="${tableStatus==='done'?'on':''}" data-st="done">Done</button>
    <button class="${tableStatus==='uncat'?'on':''}" data-st="uncat">Uncategorized</button>
  </div>
  <button class="grp-toggle ${tableGroup?'on':''}" id="grpToggle">▤ Group by project</button>
  <span class="view-sub" style="margin-top:0">${rows.length} task${rows.length!==1?'s':''}${rangeOn?' · '+fmtRange(tableFrom,tableTo):''}</span></div>`;
  h+=`<div class="week-nav" style="margin-bottom:16px"><button class="wk-chip ${!rangeOn?'on':''}" data-range="all">All time</button>`;
  tablePresets().forEach(pr=>{const on=rangeOn&&pr.from===tableFrom&&pr.to===tableTo;h+=`<button class="wk-chip ${on?'on':''}" data-from="${pr.from}" data-to="${pr.to}">${pr.label}</button>`;});
  h+=`<span class="wk-div"></span><select class="wk-sel" id="monthSel"><option value="">Any month…</option>`;
  recentMonths(15).forEach(mo=>{const sel=(tableFrom===mo.from&&tableTo===mo.to)?'selected':'';h+=`<option value="${mo.from}|${mo.to}" ${sel}>${mo.label}</option>`;});
  h+=`</select><span class="wk-div"></span>`;
  if(tblCustom)h+=`<span class="wk-lbl">range</span><input type="date" class="wk-date" id="tblFrom" value="${tableFrom}"><span class="wk-lbl">–</span><input type="date" class="wk-date" id="tblTo" value="${tableTo}">`;
  else h+=`<button class="wk-chip" id="customToggle">Custom range</button>`;
  if(rangeOn)h+=`<button class="week-copy" id="copyRep">Copy report</button>`;
  h+=`</div>`;
  h+=`<table class="grid"><thead><tr>
    <th style="width:30px"></th>
    <th data-sort="star" style="width:34px" title="Sort by star">★</th>
    <th data-sort="text">Task</th>
    <th data-sort="project" style="width:180px">Project</th>
    <th data-sort="created" style="width:92px">Created</th>
    <th data-sort="ddl" style="width:110px">Due</th>
    <th style="width:64px"></th>
  </tr></thead><tbody>`;
  if(!rows.length)h+=`<tr><td colspan="7"><div class="empty" style="padding:44px">No tasks in this view</div></td></tr>`;
  else if(tableGroup){
    const groups=new Map();
    rows.forEach(x=>{const pid=x.p?x.p.id:'__quick__',title=x.p?x.p.title:'Uncategorized';if(!groups.has(pid))groups.set(pid,{title,rows:[]});groups.get(pid).rows.push(x);});
    const order=[...state.projects.map(p=>p.id),'__quick__'];
    [...groups.keys()].sort((a,b)=>order.indexOf(a)-order.indexOf(b)).forEach(pid=>{const g=groups.get(pid);
      h+=`<tr class="grp"><td colspan="7">${esc(g.title)}<span class="grp-n">${g.rows.length}</span></td></tr>`;
      g.rows.forEach(x=>h+=tableRowHTML(x));});
  } else rows.forEach(x=>h+=tableRowHTML(x));
  h+=`</tbody></table>`;
  m.innerHTML=h;
  m.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{tableStatus=b.dataset.st;renderTable(m);});
  document.getElementById('grpToggle').onclick=()=>{tableGroup=!tableGroup;renderTable(m);};
  m.querySelector('[data-range="all"]').onclick=()=>{tableFrom='';tableTo='';tblCustom=false;renderTable(m);};
  m.querySelectorAll('.wk-chip[data-from]').forEach(b=>b.onclick=()=>{tableFrom=b.dataset.from;tableTo=b.dataset.to;tblCustom=false;renderTable(m);});
  const mo=document.getElementById('monthSel');if(mo)mo.onchange=()=>{const v=mo.value;if(!v)return;const parts=v.split('|');tableFrom=parts[0];tableTo=parts[1];tblCustom=false;renderTable(m);};
  const ct=document.getElementById('customToggle');if(ct)ct.onclick=()=>{tblCustom=true;if(!tableFrom){const w=weekBounds(0);tableFrom=ymd(w.mon);tableTo=ymd(w.sun);}renderTable(m);};
  const pick=inp=>{if(inp)inp.onclick=()=>{try{inp.showPicker&&inp.showPicker();}catch(e){}};};
  const tf=document.getElementById('tblFrom'),tt=document.getElementById('tblTo');
  if(tf){tf.onchange=()=>{tableFrom=tf.value;if(tableTo&&tableTo<tableFrom)tableTo=tableFrom;renderTable(m);};pick(tf);}
  if(tt){tt.onchange=()=>{tableTo=tt.value;if(tableFrom&&tableTo<tableFrom)tableFrom=tableTo;renderTable(m);};pick(tt);}
  const cr=document.getElementById('copyRep');if(cr)cr.onclick=()=>copyReport(tableFrom,tableTo);
  m.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{tableSort=th.dataset.sort;renderTable(m);});
  m.querySelectorAll('tbody tr[data-tid]').forEach(tr=>{
    const pid=tr.dataset.pid,tid=tr.dataset.tid;const ref=getRef(pid,tid);if(!ref.t)return;const t=ref.t;
    tr.querySelector('[data-role=check]').onchange=e=>{setDone(t,e.target.checked);save();renderAll();};
    const st=tr.querySelector('[data-role=star]');if(st)st.onclick=()=>{t.star=!t.star;save();renderTable(m);};
    const txt=tr.querySelector('[data-role=text]');txt.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();txt.blur();}});
    txt.addEventListener('blur',()=>{const v=txt.innerText.trim();if(v!==t.text){t.text=v;save();}});
    const mv=tr.querySelector('[data-role=move]');if(mv)mv.onchange=()=>handleMove(t,pid,mv.value);
    const dd=tr.querySelector('[data-role=ddl]');dd.onchange=()=>{t.ddl=dd.value;save();renderTable(m);};
    tr.querySelector('[data-role=defer]').onclick=()=>{t.ddl=addDays(t.ddl,7);save();renderTable(m);toast('Pushed 1 week → '+fmtMD(t.ddl));};
  });
}
function getRef(pid,tid){if(pid==='__quick__'){return{t:state.quick.find(x=>x.id===tid),p:null};}const p=findProj(pid);return{t:p?p.todos.find(x=>x.id===tid):null,p};}
function moveTodo(t,fromPid,toPid){if(fromPid===toPid)return;if(fromPid==='__quick__')state.quick=state.quick.filter(x=>x!==t);else{const fp=findProj(fromPid);if(fp)fp.todos=fp.todos.filter(x=>x!==t);}if(toPid==='__quick__'){if(t.notes===undefined)t.notes='';state.quick.unshift(t);}else findProj(toPid).todos.push(t);}
function handleMove(t,fromPid,val){
  if(!val)return;
  if(val==='__new__'){const name=(prompt('New project name:',t.text)||'').trim();if(!name){renderAll();return;}const np=newProject(name);state.projects.unshift(np);moveTodo(t,fromPid,np.id);}
  else moveTodo(t,fromPid,val);
  save();renderAll();toast('Moved');
}

/* ---------------- report (from Tasks range) ---------------- */
function copyReport(from,to){
  const inR=s=>s&&s>=from&&s<=to;
  const groups=[];
  state.projects.forEach(p=>{const items=p.todos.filter(t=>t.done&&inR(t.doneAt));if(items.length)groups.push({title:p.title,items:items.map(t=>t.text)});});
  const quickDone=state.quick.filter(q=>q.done&&inR(q.doneAt)).map(q=>q.text);
  const total=groups.reduce((n,g)=>n+g.items.length,0)+quickDone.length;
  let md=`# Report (${fmtRange(from,to)})\n\nDone ${total} tasks across ${groups.length} projects.\n\n## Done\n`;
  if(!groups.length&&!quickDone.length)md+=`(nothing checked off)\n`;
  groups.forEach(g=>{md+=`\n### ${g.title}\n`;g.items.forEach(t=>md+=`- ${t}\n`);});
  if(quickDone.length){md+=`\n### Uncategorized\n`;quickDone.forEach(t=>md+=`- ${t}\n`);}
  md+=`\n## In progress\n`;
  state.projects.filter(p=>!p.archived&&p.todos.some(t=>!t.done)).forEach(p=>{const d=p.todos.filter(t=>t.done).length;md+=`- ${p.title} (${d}/${p.todos.length})\n`;});
  navigator.clipboard.writeText(md).then(()=>toast('Report copied'),()=>{const ta=document.createElement('textarea');ta.value=md;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Report copied');}catch(e){alert(md);}ta.remove();});
}

/* ---------------- date picker (in-place) ---------------- */
function editDate(slot,t,after){
  slot.innerHTML=`<input type="date" class="ddl-live" value="${t.ddl||''}">`;
  const inp=slot.querySelector('input');inp.focus();try{inp.showPicker&&inp.showPicker();}catch(e){}
  inp.onchange=()=>{t.ddl=inp.value;save();after();};
  inp.onblur=()=>{setTimeout(after,120);};
}

/* ---------------- wiring ---------------- */
function bindTodoRow(row){
  const pid=row.dataset.pid,tid=row.dataset.tid;const ref=getRef(pid,tid);if(!ref.t)return;const t=ref.t;
  const chk=row.querySelector('[data-role=check]');if(chk)chk.onchange=()=>{setDone(t,chk.checked);save();renderAll();};
  const st=row.querySelector('[data-role=tstar]');if(st)st.onclick=()=>{t.star=!t.star;save();renderAll();};
  const txt=row.querySelector('[data-role=text]');
  if(txt){txt.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();txt.blur();}});txt.addEventListener('blur',()=>{const v=txt.innerText.trim();if(v!==t.text){t.text=v;save();}});}
  const slot=row.querySelector('[data-role=ddl-slot]');const dbtn=row.querySelector('[data-role=ddl]');
  if(dbtn&&slot)dbtn.onclick=()=>editDate(slot,t,()=>renderAll());
  const defer=row.querySelector('[data-role=defer]');if(defer)defer.onclick=()=>{t.ddl=addDays(t.ddl,7);save();renderAll();toast('Pushed 1 week → '+fmtMD(t.ddl));};
  const mv=row.querySelector('[data-role=move]');if(mv)mv.onchange=()=>handleMove(t,pid,mv.value);
  const del=row.querySelector('[data-role=del]');if(del)del.onclick=()=>{trashTask(pid,t);save();renderAll();toast('Moved to Trash');};
}
function removeTodo(pid,t){if(pid==='__quick__')state.quick=state.quick.filter(x=>x!==t);else{const p=findProj(pid);if(p)p.todos=p.todos.filter(x=>x!==t);}}
function bindDoneToggle(card){const dbar=card.querySelector('[data-role=done-toggle]'),dlist=card.querySelector('[data-role=done-list]');if(dbar&&dlist)dbar.onclick=e=>{e.stopPropagation();const hid=dlist.hasAttribute('hidden');if(hid){dlist.removeAttribute('hidden');dbar.classList.add('open');}else{dlist.setAttribute('hidden','');dbar.classList.remove('open');}};}
function bindHeadCollapse(head,bar,toggle){
  if(head)head.addEventListener('click',e=>{if(e.target.closest('input,button,select,[contenteditable],.drag'))return;toggle();});
  if(bar)bar.addEventListener('click',e=>{e.stopPropagation();toggle();});
}

function wireMain(){
  const m=document.getElementById('wrap');
  const ss=document.getElementById('sortSel');if(ss)ss.onchange=()=>{sortBy=ss.value;renderMain();};
  const ap=document.getElementById('addProj');if(ap)ap.onclick=()=>{const p=newProject('');state.projects.unshift(p);save();pendingFocus={type:'ptitle',pid:p.id};renderAll();};
  m.querySelectorAll('.flat .todo').forEach(bindTodoRow);
  m.querySelectorAll('.card[data-pid]').forEach(card=>{
    const p=findProj(card.dataset.pid);if(!p)return;
    const toggle=()=>{p.collapsed=!p.collapsed;save();renderAll();};
    const pcol=card.querySelector('[data-role=collapse]');if(pcol)pcol.onclick=e=>{e.stopPropagation();toggle();};
    bindHeadCollapse(card.querySelector('[data-role=head]'),card.querySelector('[data-role=pbar]'),toggle);
    card.querySelectorAll('.todos .todo, .done-list .todo').forEach(bindTodoRow);
    bindDoneToggle(card);
    const star=card.querySelector('[data-role=star]');if(star)star.onclick=e=>{e.stopPropagation();p.star=!p.star;save();renderAll();};
    const title=card.querySelector('[data-role=title]');
    if(title){title.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();title.blur();}});title.addEventListener('blur',()=>{const v=title.innerText.trim();if(v!==p.title){p.title=v;save();}});}
    const tgt=card.querySelector('[data-role=target]');if(tgt)tgt.onchange=()=>{p.target=tgt.value;save();renderAll();};
    const arch=card.querySelector('[data-role=archive]');if(arch)arch.onclick=e=>{e.stopPropagation();p.archived=!p.archived;p.collapsed=false;save();renderAll();toast(p.archived?'Archived':'Unarchived');};
    const pdel=card.querySelector('[data-role=pdel]');if(pdel)pdel.onclick=e=>{e.stopPropagation();trashProject(p);save();renderAll();toast('Project moved to Trash');};
    const addT=card.querySelector('[data-role=add-todo]');
    if(addT)addT.addEventListener('keydown',e=>{if(e.key==='Enter'&&addT.value.trim()){p.todos.push(newTask(addT.value.trim()));save();pendingFocus={type:'add-todo',pid:p.id};renderAll();}});
    const nbar=card.querySelector('[data-role=notes-toggle]'),nwrap=card.querySelector('[data-role=notes-wrap]');
    if(nbar&&nwrap)nbar.onclick=e=>{e.stopPropagation();toggleNotes(p,nwrap,nbar);};
    const todosEl=card.querySelector('.todos');
    if(todosEl&&view==='all')enableSortable(todosEl,'.todo','data-tid',ids=>{const map=new Map(p.todos.filter(t=>!t.done).map(t=>[t.id,t]));const no=ids.map(id=>map.get(id)).filter(Boolean);p.todos=[...no,...p.todos.filter(t=>t.done)];save();renderAll();});
  });
  const ucard=m.querySelector('.card[data-uncat]');
  if(ucard){
    const toggleU=()=>{uncatCollapsed=!uncatCollapsed;renderAll();};
    const pcol=ucard.querySelector('[data-role=collapse]');if(pcol)pcol.onclick=e=>{e.stopPropagation();toggleU();};
    bindHeadCollapse(ucard.querySelector('[data-role=head]'),null,toggleU);
    ucard.querySelectorAll('.todos .todo, .done-list .todo').forEach(bindTodoRow);
    bindDoneToggle(ucard);
    const uadd=ucard.querySelector('[data-role=uncat-add]');
    if(uadd)uadd.addEventListener('keydown',e=>{if(e.key==='Enter'&&uadd.value.trim()){const nt=newTask(uadd.value.trim());nt.notes='';state.quick.unshift(nt);save();renderAll();}});
    const uEl=ucard.querySelector('.todos');if(uEl)enableSortable(uEl,'.todo','data-tid',ids=>{const map=new Map(state.quick.filter(t=>!t.done).map(t=>[t.id,t]));const no=ids.map(id=>map.get(id)).filter(Boolean);state.quick=[...no,...state.quick.filter(t=>t.done)];save();renderAll();});
  }
  if(view==='all'&&sortBy==='manual'&&!query&&projStatus!=='archived'){const g=m.querySelector('.proj-cards');if(g)enableSortable(g,'.card[data-pid]','data-pid',ids=>{const map=new Map(state.projects.map(p=>[p.id,p]));const moved=ids.map(id=>map.get(id)).filter(Boolean);const rest=state.projects.filter(p=>!ids.includes(p.id));state.projects=[...moved,...rest];save();renderAll();});}
  applyPending();
}
function toggleNotes(obj,wrap,bar){if(wrap.hasAttribute('hidden')){openNotes(obj,wrap);bar.classList.add('open');}else{wrap.setAttribute('hidden','');wrap.innerHTML='';bar.classList.remove('open');}}
function openNotes(obj,wrap){
  wrap.removeAttribute('hidden');
  const render=()=>{wrap.innerHTML=`<div class="notes-view" data-role="nview">${markdown(obj.notes)}</div>`;wrap.querySelector('[data-role=nview]').onclick=()=>edit();};
  const edit=()=>{wrap.innerHTML=`<textarea class="notes-edit" data-role="nedit">${esc(obj.notes||'')}</textarea><div class="notes-hint">**bold** · - list · # heading · \`code\` · paste links. Click outside to save.</div>`;
    const ta=wrap.querySelector('[data-role=nedit]');ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
    ta.addEventListener('input',()=>{obj.notes=ta.value;save();});
    ta.addEventListener('blur',()=>{obj.notes=ta.value;save();render();});};
  (obj.notes&&obj.notes.trim())?render():edit();
}
function applyPending(){
  if(pendingFocus){const {type,pid}=pendingFocus;pendingFocus=null;const card=document.querySelector('.card[data-pid="'+pid+'"]');if(card){if(type==='ptitle'){const el=card.querySelector('[data-role=title]');el&&el.focus();}if(type==='add-todo'){const el=card.querySelector('[data-role=add-todo]');if(el){el.focus();el.scrollIntoView({block:'nearest'});}}}}
  if(pendingScroll){const id=pendingScroll;pendingScroll=null;const card=document.querySelector('.card[data-pid="'+id+'"]');if(card){card.scrollIntoView({behavior:'smooth',block:'center'});card.classList.add('flash');setTimeout(()=>card.classList.remove('flash'),1700);}}
}

/* ---------------- header + boot ---------------- */
function renderAll(){renderSidebar();renderMain();}
function applyTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem(THEME_KEY,t);}catch(e){}}
function initHeader(){
  const d=new Date(),wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  document.getElementById('today').textContent=`${d.getMonth()+1}/${d.getDate()} ${wd}`;
  const qa=document.getElementById('quickAdd');
  qa.addEventListener('keydown',e=>{if(e.key==='Enter'&&qa.value.trim()){const nt=newTask(qa.value.trim());nt.notes='';state.quick.unshift(nt);qa.value='';save();renderAll();toast('Captured · Projects › Uncategorized');}});
  const s=document.getElementById('search');s.addEventListener('input',()=>{query=s.value.trim();renderMain();});
  const themeBtn=document.getElementById('themeBtn'),bindBtn=document.getElementById('bindBtn');
  const setThemeIcon=()=>{themeBtn.innerHTML=document.documentElement.dataset.theme==='dark'?SUN:MOON;};
  setThemeIcon();bindBtn.innerHTML=CLOUD;
  themeBtn.onclick=()=>{applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');setThemeIcon();};
  bindBtn.onclick=bindFile;
}
async function boot(){
  try{const th=localStorage.getItem(THEME_KEY);if(th)document.documentElement.dataset.theme=th;}catch(e){}
  initHeader();
  try{const raw=localStorage.getItem(LS_KEY);if(raw)state=migrate(JSON.parse(raw));}catch(e){}
  renderAll();
  const changed=await restoreFile();updateStoragePill();if(changed)renderAll();
}
boot();
</script>
